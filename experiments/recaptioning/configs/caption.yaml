defaults:
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.85
  max_num_seqs: 256
  max_model_len: 1024
  chunk_size: 750

sampling:
  temperature: 0.0
  max_tokens: 80
  seed: 42

prompt:
  id: v1_20_30_words
  text: >-
    Describe this image in 20-30 words. Do not include any preamble or
    introduction, just the description.

models:
  gemma-3-27b-it:
    hf_id: google/gemma-3-27b-it
    family: gemma3
    tensor_parallel_size: 1
    min_gpu_gb: 72
  gemma-3-4b-it:
    hf_id: google/gemma-3-4b-it
    family: gemma3
    tensor_parallel_size: 1
    min_gpu_gb: 20
