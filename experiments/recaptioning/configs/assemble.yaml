shard:
  pairs_per_shard: 16935
  name_template: "shards-{idx:05d}.tar"
  tar_format: GNU

normalizer:
  version: v1
  word_count: [1, 200]   # sanity bounds only; real filtering happens upstream of captioning

selection:
  overlap_mode: disjoint   # disjoint (default) | iid

versions:
  - name: laion_s0
    seed: 0
  - name: laion_s1
    seed: 1
  - name: laion_s2
    seed: 2
  - name: laion_s3
    seed: 3
