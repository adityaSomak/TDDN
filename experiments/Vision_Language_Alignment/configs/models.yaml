# Model registry for vision-language alignment evaluation.
#
# Single source of truth for encoder wiring: `evaluation/src/encoders.py` builds
# both the global and the dense encoder for a tag from its entry here.
#
# Fields
#   family        selects the encoder implementation:
#                   clip       HuggingFace CLIP
#                   open_clip  open_clip ViT
#                   siglip     open_clip timm-backed SigLIP ViT
#                   fgclip2    FG-CLIP2 (trust_remote_code)
#                   trained    a trained alignment head via shared_utils
#   arch          open_clip/siglip architecture name
#   pretrained    open_clip pretrained tag
#   hf_id         HuggingFace repo id (fgclip2)
#   patch_mode    fgclip2 patch budget: native | fixed576 | fixed1024
#   backbone      shared_utils backbone tag (trained)
#   input_size    global-task input resolution
#   dense_bypass  dense-readout variant: none | last | all
#   checkpoint    flat local checkpoint directory or Hugging Face repo id
#
# `arch` and the `round_<n>` blocks are read by run_train.py.

baselines:
  clip:
    family: clip
    backbone: clip-vitl14
    text_encoder: clip-vitl14
    input_size: 336
    transform: {strategy: imagenet_center_crop, input_size: 336}

  # openai/metaclip/dfn checkpoints were trained with QuickGELU; the plain arch
  # name silently mismatches the activation. LAION-2B used plain GELU.
  metaclip_l14:
    family: open_clip
    arch: ViT-L-14-quickgelu
    pretrained: metaclip_fullcc

  dfn_l14:
    family: open_clip
    arch: ViT-L-14-quickgelu
    pretrained: dfn2b

  openclip_l14:
    family: open_clip
    arch: ViT-L-14
    pretrained: laion2b_s32b_b82k

  siglip2_l16:
    family: siglip
    arch: ViT-L-16-SigLIP2-384
    pretrained: webli

  fgclip2_large:
    family: fgclip2
    hf_id: qihoo360/fg-clip2-large
    patch_mode: fixed1024

trained:
  tdn:
    family: trained
    backbone: vith-roberta
    text_encoder: roberta-large
    input_size: 336
    dense_bypass: last
    transform: {strategy: imagenet_center_crop, input_size: 336}
    checkpoint: TDN
    arch:
      embed_dim: 2560
      vision_num_head_blocks: 2
      text_num_head_blocks: 2
      text_layer_idx: 24
      text_head_blocks_drop_path: 0.1
      use_rope_in_head: true
      use_linear_projection: false
    round_2: {max_iterations: 500, warmup_iterations: 50}

  tddn:
    family: trained
    backbone: fused-dinov3-cd
    text_encoder: roberta-large
    input_size: 336
    dense_bypass: all
    transform: {strategy: imagenet_center_crop, input_size: 336}
    checkpoint: TDDN
    arch:
      embed_dim: 2560
      vision_num_head_blocks: 2
      text_num_head_blocks: 2
      text_layer_idx: 24
      text_head_blocks_drop_path: 0.1
      use_rope_in_head: true
      use_linear_projection: false
      use_fused_encoder: true
      cleandift_proj_dim: 512
      cleandift_common_grid: 21
    round_2: {max_iterations: 200, warmup_iterations: 20}

defaults:
  classification:
    tip_alphas: [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 4.0, 5.0, 7.5, 10.0]
    tip_k_default: 16
    tip_k_sweep: [1, 2, 4, 8, 16]
  retrieval:
    k_list: [1, 5, 10]
  segmentation:
    stride_ratio: 0.5                 # sliding-window stride as a fraction of crop size
